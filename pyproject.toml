[project]
name = "rest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jcyran", email = "cyran.jakub03@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
rest = "main:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
